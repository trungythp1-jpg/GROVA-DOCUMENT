<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Bìa hợp đồng - GROVA DOCUMENT</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#eef1ee;color:#17352c;font-family:Arial,Helvetica,sans-serif}
.topbar{position:sticky;top:0;z-index:20;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#fff;border-bottom:1px solid #d9e1de;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.topbar-left{display:flex;align-items:center;gap:12px}.top-actions{display:flex;gap:8px}.secondary-btn{background:#e8efeb;color:#075a43}
button{border:0;border-radius:10px;padding:10px 15px;cursor:pointer;font-weight:700;font-size:14px}
.back-btn{background:#eef4f1;color:#075a43}.print-btn{background:#0b7a5a;color:#fff}
.topbar-title{font-size:17px;font-weight:800}
.workspace{width:min(1500px,calc(100% - 28px));margin:20px auto;display:grid;grid-template-columns:340px minmax(0,1fr);gap:22px;align-items:start}
.control-panel{background:#fff;border:1px solid #d9e1de;border-radius:14px;padding:18px;height:max-content;box-shadow:0 4px 16px rgba(0,0,0,.05);position:sticky;top:78px}
.panel-title{font-size:17px;font-weight:800;margin-bottom:16px;color:#075a43}
.form-group{margin-bottom:15px}.form-label{display:block;margin-bottom:6px;font-size:13px;font-weight:700}
.form-input,.form-textarea{width:100%;border:1px solid #cfd9d5;border-radius:8px;padding:10px;font:13px Arial,sans-serif;outline:none;background:#fff}
.form-textarea{resize:vertical;min-height:88px}.form-input:focus,.form-textarea:focus{border-color:#0b7a5a;box-shadow:0 0 0 3px rgba(11,122,90,.08)}
.panel select{background:#fff;color:#17231e;cursor:pointer}.hint{font-size:11px;line-height:1.5;color:#68736f;margin-top:14px}
.preview-area{min-width:0}.document-wrap{overflow:auto;padding:8px 4px 24px}
.document{position:relative;width:210mm;height:297mm;max-width:none;margin:0 auto;background:#fff;box-shadow:0 5px 22px rgba(0,0,0,.13);overflow:hidden}
.cover-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.dynamic{position:absolute;color:#17352c;text-align:center;white-space:pre-wrap;overflow:hidden;overflow-wrap:break-word;font-family:"Times New Roman",Georgia,serif}
.contract-no{left:34%;top:39.85%;width:45%;height:4.4%;font-size:19px;font-weight:700;line-height:1.15;display:flex;align-items:center;justify-content:flex-start;text-align:left;padding:0}
.subject{left:15%;top:43.7%;width:70%;height:9.4%;font-family:Georgia,serif;font-size:clamp(18px,2.05vw,30px);font-weight:700;line-height:1.15;display:flex;align-items:center;justify-content:center;text-align:center;white-space:normal;overflow:hidden;padding:0 3%;}
.party-b{left:18%;top:79.0%;width:64%;height:4.8%;font-size:18px;font-weight:700;line-height:1.2;display:flex;align-items:center;justify-content:center;text-align:center}
@media(max-width:900px){.workspace{grid-template-columns:1fr;width:calc(100% - 20px)}.control-panel{position:static}.document{margin:0 auto}}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-left">
    <button class="back-btn" onclick="history.back()">← Quay lại</button>
    <div class="topbar-title">Bìa hợp đồng</div>
  </div>
  <div class="top-actions"><button class="print-btn" onclick="exportPDF()">⬇ Xuất PDF A4 1 trang</button></div>
</div>

<div class="workspace">
  <aside class="control-panel">
    <div class="panel-title">Thông tin bìa hợp đồng</div>

    <div class="form-group">
      <label class="form-label">Số HĐ</label>
      <input id="contractNo" class="form-input" placeholder="Ví dụ: GROVA-2026-001">
    </div>

    <div class="form-group">
      <label>Nội dung hợp đồng
  <select id="subject">
    <option value="">-- Chọn nội dung hợp đồng --</option>
    <option value="CUNG CẤP KHUNG THANG MÁY">1. CUNG CẤP KHUNG THANG MÁY</option>
    <option value="CUNG CẤP KHUNG THANG MÁY VÀ KÍNH THANG MÁY">2. CUNG CẤP KHUNG THANG MÁY VÀ KÍNH THANG MÁY</option>
    <option value="CUNG CẤP KÍNH THANG MÁY">3. CUNG CẤP KÍNH THANG MÁY</option>
    <option value="CUNG CẤP NHÂN CÔNG THI CÔNG LẮP ĐẶT KHUNG THANG MÁY">4. CUNG CẤP NHÂN CÔNG THI CÔNG LẮP ĐẶT KHUNG THANG MÁY</option>
    <option value="CUNG CẤP NHÂN CÔNG THI CÔNG LẮP ĐẶT KÍNH THANG MÁY">5. CUNG CẤP NHÂN CÔNG THI CÔNG LẮP ĐẶT KÍNH THANG MÁY</option>
    <option value="CUNG CẤP KÍNH VÀ NHÂN CÔNG LẮP ĐẶT KÍNH THANG MÁY">6. CUNG CẤP KÍNH VÀ NHÂN CÔNG LẮP ĐẶT KÍNH THANG MÁY</option>
  </select>
</label>
      
    </div>

    <div class="form-group">
      <label class="form-label">Bên B</label>
      <input id="partyB" class="form-input" placeholder="Ví dụ: ÔNG HOÀNG VĂN QUYẾT">
    </div>

    <div class="hint">
      Bìa giữ nguyên thiết kế GROVA. Chỉ các thông tin nhập bên trái thay đổi trên bản xem trước.
      Chọn nội dung hợp đồng từ danh sách để bìa tự điền. Bìa được xuất trực tiếp thành PDF A4 1 trang.
    </div>
  </aside>

  <section class="preview-area">
    <div class="document-wrap">
      <div class="document">
        <img class="cover-bg" src="../assets/grova-contract-cover-2026.png" alt="GROVA contract cover">
        <div id="previewNo" class="dynamic contract-no"></div>
        <div id="previewSubject" class="dynamic subject"></div>
        <div id="previewPartyB" class="dynamic party-b"></div>
      </div>
    </div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script>
const fields={
  contractNo:document.getElementById("contractNo"),
  subject:document.getElementById("subject"),
  partyB:document.getElementById("partyB")
};
const previews={
  contractNo:document.getElementById("previewNo"),
  subject:document.getElementById("previewSubject"),
  partyB:document.getElementById("previewPartyB")
};


function fitSubjectText(){
  const el = preview.subject;
  if (!el) return;
  const text = el.textContent.trim();
  if (!text) return;
  let size = 30;
  const minSize = 18;
  el.style.fontSize = size + 'px';
  el.style.lineHeight = '1.15';
  while ((el.scrollHeight > el.clientHeight || el.scrollWidth > el.clientWidth) && size > minSize){
    size -= 1;
    el.style.fontSize = size + 'px';
  }
}

function sync(){
  previews.contractNo.textContent=fields.contractNo.value.trim();
  previews.subject.textContent=fields.subject.value.trim();
  previews.partyB.textContent=fields.partyB.value.trim();
  try{
    localStorage.setItem("GROVA_CONTRACT_COVER_V1",JSON.stringify({
      contractNo:fields.contractNo.value,
      subject:fields.subject.value,
      partyB:fields.partyB.value
    }));
  }catch(e){}
  requestAnimationFrame(()=>{fitSubject();fitParty();});
}
Object.values(fields).forEach(el=>el.addEventListener("input",sync));
try{
  const saved=JSON.parse(localStorage.getItem("GROVA_CONTRACT_COVER_V1")||"null");
  if(saved){
    fields.contractNo.value=saved.contractNo||"";
    fields.subject.value=saved.subject||"";
    fields.partyB.value=saved.partyB||"";
  }
}catch(e){}
sync();
function fitSubject(){
  const el = previews.subject;
  let size = 21;
  el.style.fontSize = size + "px";
  while ((el.scrollHeight > el.clientHeight || el.scrollWidth > el.clientWidth) && size > 11){
    size -= 0.5;
    el.style.fontSize = size + "px";
  }
}
function fitParty(){
  const el = previews.partyB;
  let size = 18;
  el.style.fontSize = size + "px";
  while ((el.scrollHeight > el.clientHeight || el.scrollWidth > el.clientWidth) && size > 13){
    size -= 0.5;
    el.style.fontSize = size + "px";
  }
}
async function exportPDF(){
  const btn = document.querySelector('.print-btn');
  btn.disabled = true;
  const bg = new Image();
  bg.src = "../assets/grova-contract-cover-2026.png";
  await new Promise((resolve,reject)=>{bg.onload=resolve;bg.onerror=reject;});
  const W=2480,H=3508;
  const canvas=document.createElement("canvas");
  canvas.width=W; canvas.height=H;
  const ctx=canvas.getContext("2d");
  ctx.imageSmoothingEnabled=true;
  ctx.imageSmoothingQuality="high";
  ctx.drawImage(bg,0,0,W,H);

  function drawText(text, xPct, yPct, wPct, hPct, maxPx, align="center"){
    if(!text) return;
    const x=xPct/100*W, y=yPct/100*H, w=wPct/100*W, h=hPct/100*H;
    ctx.save();
    ctx.fillStyle="#17352c";
    ctx.textAlign=align;
    ctx.textBaseline="middle";
    ctx.font=`700 ${maxPx}px "Times New Roman", Georgia, serif`;
    const lines=text.split(/\r?\n/);
    let fs=maxPx;
    function wrapLine(line){
      return line;
    }
    // Reduce font size until all lines fit the box.
    while(fs>32){
      ctx.font=`700 ${fs}px "Times New Roman", Georgia, serif`;
      const lh=fs*1.15;
      const total=lines.length*lh;
      const tooTall=total>h;
      const tooWide=lines.some(t=>ctx.measureText(t).width>w);
      if(!tooTall && !tooWide) break;
      fs-=2;
    }
    ctx.font=`700 ${fs}px "Times New Roman", Georgia, serif`;
    const lh=fs*1.15;
    const startY=y+(h-totalHeight(lines,lh))/2+lh/2;
    const tx = align === "left" ? x : x + w/2;
    lines.forEach((line,i)=>ctx.fillText(line,tx,startY+i*lh));
    ctx.restore();
  }
  function totalHeight(lines,lh){return lines.length*lh;}

  drawText(fields.contractNo.value.trim(),34,39.85,45,4.4,58,"left");
  drawText(fields.subject.value.trim(),14,44.9,72,9.2,62,"center");
  drawText(fields.partyB.value.trim(),18,79.0,64,4.8,58,"center");

  const {jsPDF}=window.jspdf;
  const pdf=new jsPDF({orientation:"p",unit:"mm",format:"a4",compress:true});
  pdf.addImage(canvas.toDataURL("image/jpeg",0.96),"JPEG",0,0,210,297,undefined,"FAST");
  const safe=(fields.contractNo.value.trim()||"GROVA-CONTRACT").replace(/[^\w\-]+/g,"-");
  pdf.save(`${safe}-BIA-HOP-DONG.pdf`);
  btn.disabled=false;
}

</script>
</body>
</html>
